<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Muditya Raghav">
  <title>Muditya Raghav</title>
  <!--
    Monogram, drawn as stroked paths rather than <text> so the mark renders
    identically everywhere and the PNG fallbacks rasterise deterministically.

    Geometry: 64x64 canvas, 14px corner radius, accent (#2563eb) ground.
    Cap height 26 (y 19 to 45), stroke 5, so ink sits in x 11.5 to 52 and the
    gap between the two letterforms is 5 units, enough to stay separated when
    the icon is downscaled to 16px.
  -->
  <rect width="64" height="64" rx="14" fill="#2563eb"/>

  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="butt" stroke-linejoin="miter"
     shape-rendering="geometricPrecision">
    <!-- M: two stems joined by a central V -->
    <path d="M14 45 V19 L21 31 L28 19 V45"/>
    <!-- R: stem, bowl, leg -->
    <path d="M38 45 V19"/>
    <path d="M38 22 H45 A5 5 0 0 1 45 32 H38"/>
    <path d="M43.5 32 L49.5 45"/>
  </g>
</svg>
